{% extends "base.html" %}
{% block title %}Nueva retención{% endblock %}
{% block content %}
<h2>Registrar retención</h2>
<p class="lead">Úselo si una empresa le retuvo por fuera de una venta ya cargada. Lo habitual es registrarla al guardar la venta a empresa.</p>
<div class="panel">
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Guardar retención</button>
    <a class="btn" href="{% url 'inicio' %}">Cancelar</a>
  </form>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}Nueva compra{% endblock %}
{% block content %}
<h2>Registro de compra o gasto</h2>
<div class="panel">
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Guardar compra</button>
    <a class="btn btn-ghost" href="{% url 'inicio' %}">Cancelar</a>
  </form>
</div>
{% endblock %}
